[package]
name = "rpg-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
base64 = "0.22"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
surrealdb = { version = "1.5", features = ["kv-mem"] }
rand = "0.8"
rhai = { version = "1.19.0", features = ["sync", "serde"] }
bincode = "1.3"
rusqlite = "0.40.2"
uuid = { version = "1.26.1", features = ["v4"] }
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.1", features = ["cors"] }
