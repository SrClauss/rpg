[package]
name = "rpg-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
base64 = "0.22"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
surrealdb = { version = "1.5", features = ["kv-mem"] }
rand = "0.8"
rhai = { version = "1.19.0", features = ["sync", "serde"] }
bincode = "1.3"
