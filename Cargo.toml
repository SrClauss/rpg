[package]
name = "rpg-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
base64 = "0.22"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
rand = "0.8"
rhai = { version = "1.19.0", features = ["sync", "serde"] }
bincode = "1.3"
chrono = "0.4"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
futures-util = "0.3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
